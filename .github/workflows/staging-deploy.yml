name: AI Staging Deploy

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "V2 Docker image Git SHA (40 characters)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    name: V2 Staging Deploy

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/deploy.yml

    with:
      environment: staging
      github_environment: staging
      image_sha: ${{ inputs.image_sha }}
    secrets: inherit
