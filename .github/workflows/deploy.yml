name: Deploy AI to V2 ECS

on:
  workflow_call:
    inputs:
      environment:
        description: "배포할 V2 환경"
        required: true
        type: string
      github_environment:
        description: "배포 승인과 OIDC 인증에 사용할 GitHub Environment"
        required: true
        type: string
      image_sha:
        description: "V2 ECR 이미지 태그에 사용할 Git SHA"
        required: true
        type: string
      verify_dev_match:
        description: "현재 Dev에서 검증 중인 이미지와 같은지 확인"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "919551759796"
  ECR_REPOSITORY: need-u/ai
  ECR_REPOSITORY_URI: 919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/ai

jobs:
  deploy:
    name: Deploy AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.github_environment }}

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: deploy-${{ inputs.environment }}-ai
      cancel-in-progress: false

    steps:
      - name: Validate Inputs
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          AWS_CD_ROLE_ARN: ${{ vars.AWS_CD_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_ENVIRONMENT" =~ ^(dev|staging|prod)$ ]]; then
            echo "::error::지원하지 않는 배포 환경입니다: $DEPLOY_ENVIRONMENT"
            exit 1
          fi

          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::이미지 SHA는 40자리 Git SHA여야 합니다."
            exit 1
          fi

          if [[ -z "$AWS_CD_ROLE_ARN" ]]; then
            echo "::error::GitHub Environment에 AWS_CD_ROLE_ARN 변수가 필요합니다."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Unexpected AWS account: $ACCOUNT_ID"
            exit 1
          fi

      - name: Resolve Deployment Resources
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          {
