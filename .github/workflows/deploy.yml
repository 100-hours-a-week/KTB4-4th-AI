name: Deploy V2 AI

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string
      github_environment:
        description: "GitHub Environment"
        required: true
        type: string
      image_sha:
        description: "Original Dev commit SHA"
        required: true
        type: string
      verify_dev_match:
        description: "Verify current Dev ECS image"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Deploy AI
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}

    concurrency:
      group: ai-v2-deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: "919551759796"
      DEPLOY_ENV: ${{ inputs.environment }}
      IMAGE_SHA: ${{ inputs.image_sha }}
      ECR_REPOSITORY: need-u/ai
      ECR_REPOSITORY_URI: ${{ vars.AWS_ECR_REPOSITORY_URI }}
      ECS_CLUSTER: needu-${{ inputs.environment }}-cluster
      ECS_SERVICE: needu-${{ inputs.environment }}-ai
      SSM_BASE_TASK_DEFINITION: /needu/v2/${{ inputs.environment }}/ecs/ai/base-task-definition-arn

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Deployment Inputs
        shell: bash
        run: |
          set -euo pipefail

          case "$DEPLOY_ENV" in
            dev|staging|prod)
              ;;
            *)
              echo "::error::Unsupported environment: $DEPLOY_ENV"
              exit 1
              ;;
          esac

          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_sha must be a full 40-character SHA"
            exit 1
          fi

          if [[ -z "$ECR_REPOSITORY_URI" ]]; then
            echo "::error::AWS_ECR_REPOSITORY_URI is not configured"
            exit 1
          fi

          EXPECTED_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          if [[ "$ECR_REPOSITORY_URI" != "$EXPECTED_URI" ]]; then
            echo "::error::Unexpected ECR repository URI"
            exit 1
          fi

          IMAGE_TAG="v2-${IMAGE_SHA}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"

          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "IMAGE_URI=$IMAGE_URI"
          } >> "$GITHUB_ENV"

          echo "Environment: $DEPLOY_ENV"
          echo "Image: $IMAGE_URI"

      - name: Verify SHA Exists In Main
        if: inputs.environment == 'prod'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if ! git cat-file -e "${IMAGE_SHA}^{commit}"; then
            echo "::error::Commit not found: $IMAGE_SHA"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$IMAGE_SHA" origin/main; then
            echo "::error::Dev SHA is not an ancestor of main"
            exit 1
          fi

          echo "SHA is included in main history."

      - name: Verify Successful Dev CI And ECS Deployment
        if: inputs.environment == 'prod'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ inputs.image_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.TARGET_SHA;

            core.info(`Target SHA: ${sha}`);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: "ai-ci.yml",
                branch: "dev",
                event: "push",
                per_page: 100
              }
            );

            const matchingRuns = runs.filter(run =>
              run.head_sha === sha &&
              run.head_branch === "dev" &&
              run.event === "push" &&
              run.conclusion === "success"
            );

            core.info(
              `Matching successful Dev runs: ${matchingRuns.length}`
            );

            if (matchingRuns.length === 0) {
              core.setFailed(
                `동일 SHA의 성공한 Dev CI 실행을 찾지 못했습니다: ${sha}`
              );
              return;
            }

            for (const run of matchingRuns) {
              core.info(`Checking run: ${run.html_url}`);

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                }
              );

              for (const job of jobs) {
                core.info(
                  `Job: ${job.name} / ${job.conclusion}`
                );
              }

              const testPassed = jobs.some(job =>
                job.name === "Python Test" &&
                job.conclusion === "success"
              );

              const imageBuilt = jobs.some(job =>
                job.name === "Build & Push V2 Image" &&
                job.conclusion === "success"
              );

              const devDeployed = jobs.some(job =>
                (
                  job.name === "Deploy V2 Dev / Deploy AI" ||
                  job.name.startsWith("Deploy V2 Dev /")
                ) &&
                job.conclusion === "success"
              );

              if (testPassed && imageBuilt && devDeployed) {
                core.info("Dev CI and ECS deployment verified.");
                core.info(`Run: ${run.html_url}`);
                return;
              }
            }

            core.setFailed(
              `동일 SHA의 Dev ECS 배포 성공 Job을 확인하지 못했습니다: ${sha}`
            );

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Verify AWS Account
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ "$ACTUAL_ACCOUNT" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Unexpected AWS account"
            exit 1
          fi

      - name: Verify ECR Image
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "ECR image verified: $IMAGE_URI"

      - name: Verify Current Dev ECS Image
        if: inputs.environment == 'prod' && inputs.verify_dev_match
        shell: bash
        run: |
          set -euo pipefail

          DEV_TASK_DEFINITION="$(aws ecs describe-services \
            --cluster needu-dev-cluster \
            --services needu-dev-ai \
            --query 'services[0].taskDefinition' \
            --output text)"

          if [[ -z "$DEV_TASK_DEFINITION" || "$DEV_TASK_DEFINITION" == "None" ]]; then
            echo "::error::Dev ECS task definition not found"
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$DEV_TASK_DEFINITION" \
            --query 'taskDefinition.containerDefinitions' \
            --output json \
            > dev-containers.json

          if ! jq -e --arg IMAGE "$IMAGE_URI" \
            'any(.[]; .image == $IMAGE)' \
            dev-containers.json > /dev/null; then
            echo "::error::Current Dev ECS image differs from requested image"
            exit 1
          fi

          echo "Current Dev ECS image verified."

      - name: Load Base Task Definition
        shell: bash
        run: |
          set -euo pipefail

          BASE_TASK_DEFINITION="$(aws ssm get-parameter \
            --name "$SSM_BASE_TASK_DEFINITION" \
            --query 'Parameter.Value' \
            --output text)"

          if [[ -z "$BASE_TASK_DEFINITION" || "$BASE_TASK_DEFINITION" == "None" ]]; then
            echo "::error::Base task definition ARN not found"
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$BASE_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json \
            > base-task-definition.json

      - name: Prepare New Task Definition
        shell: bash
        run: |
          set -euo pipefail

          jq --arg IMAGE "$IMAGE_URI" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions |= map(
                if .name == "ai" then
                  .image = $IMAGE
                else
                  .
                end
              )
          ' base-task-definition.json > new-task-definition.json

          if ! jq -e --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions | any(.[]; .name == "ai" and .image == $IMAGE)' \
            new-task-definition.json > /dev/null; then
            echo "::error::AI container image was not updated"
            exit 1
          fi

      - name: Check ECS Service State
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0]' \
            --output json \
            > service-before.json

          STATUS="$(jq -r '.status // "MISSING"' service-before.json)"
          DESIRED_COUNT="$(jq -r '.desiredCount // -1' service-before.json)"
          RUNNING_COUNT="$(jq -r '.runningCount // -1' service-before.json)"

          if [[ "$STATUS" != "ACTIVE" ]]; then
            echo "::error::ECS service is not ACTIVE: $STATUS"
            exit 1
          fi

          if [[ "$DEPLOY_ENV" == "prod" ]]; then
            if [[ "$DESIRED_COUNT" != "0" || "$RUNNING_COUNT" != "0" ]]; then
              echo "::error::Prod ECS must remain stopped (desired=0, running=0)"
              exit 1
            fi
          fi

          {
            echo "DESIRED_COUNT_BEFORE=$DESIRED_COUNT"
            echo "RUNNING_COUNT_BEFORE=$RUNNING_COUNT"
          } >> "$GITHUB_ENV"

      - name: Register New Task Definition
        shell: bash
        run: |
          set -euo pipefail

          NEW_TASK_DEFINITION="$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "NEW_TASK_DEFINITION=$NEW_TASK_DEFINITION" >> "$GITHUB_ENV"

          echo "Registered: $NEW_TASK_DEFINITION"

      - name: Update ECS Service
        shell: bash
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION" \
            > /dev/null

          echo "ECS service task definition updated."

      - name: Wait For ECS Service Stability
        if: env.DESIRED_COUNT_BEFORE != '0'
        shell: bash
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify ECS Deployment
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0]' \
            --output json \
            > service-after.json

          ACTUAL_TASK_DEFINITION="$(jq -r '.taskDefinition' service-after.json)"
          ACTUAL_DESIRED_COUNT="$(jq -r '.desiredCount' service-after.json)"
          ACTUAL_RUNNING_COUNT="$(jq -r '.runningCount' service-after.json)"

          if [[ "$ACTUAL_TASK_DEFINITION" != "$NEW_TASK_DEFINITION" ]]; then
            echo "::error::ECS service task definition mismatch"
            exit 1
          fi

          if [[ "$ACTUAL_DESIRED_COUNT" != "$DESIRED_COUNT_BEFORE" ]]; then
            echo "::error::ECS desired count unexpectedly changed"
            exit 1
          fi

          if [[ "$DEPLOY_ENV" == "prod" && "$ACTUAL_RUNNING_COUNT" != "0" ]]; then
            echo "::error::Prod ECS unexpectedly started"
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$ACTUAL_TASK_DEFINITION" \
            --query 'taskDefinition.containerDefinitions' \
            --output json \
            > deployed-containers.json

          if ! jq -e --arg IMAGE "$IMAGE_URI" \
            'any(.[]; .name == "ai" and .image == $IMAGE)' \
            deployed-containers.json > /dev/null; then
            echo "::error::Deployed image mismatch"
            exit 1
          fi

          echo "ECS task definition and image verified."

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## AI V2 Deployment"
            echo ""
            echo "- Environment: $DEPLOY_ENV"
            echo "- Image: $IMAGE_URI"
            echo "- ECS Cluster: $ECS_CLUSTER"
            echo "- ECS Service: $ECS_SERVICE"
            echo "- Task Definition: $NEW_TASK_DEFINITION"
            echo "- Desired Count: $DESIRED_COUNT_BEFORE"
            echo ""
            if [[ "$DEPLOY_ENV" == "prod" ]]; then
              echo "Prod task definition updated without starting ECS tasks."
            else
              echo "ECS deployment verification completed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
