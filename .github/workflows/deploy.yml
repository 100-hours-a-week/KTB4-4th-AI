name: Deploy AI to V2 ECS

on:
  workflow_call:
    inputs:
      environment:
        description: "배포할 V2 환경"
        required: true
        type: string
      github_environment:
        description: "배포 승인과 OIDC 인증에 사용할 GitHub Environment"
        required: true
        type: string
      image_sha:
        description: "V2 ECR 이미지 태그에 사용할 Git SHA"
        required: true
        type: string
      deployment_type:
        description: "image 또는 config-only"
        required: false
        default: image
        type: string
      allow_prod_image:
        description: "Production 전용 승격 워크플로에서만 true"
        required: false
        default: false
        type: boolean
      verify_dev_match:
        description: "현재 Dev에서 검증 중인 이미지와 같은지 확인"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "919551759796"
  ECR_REPOSITORY: need-u/ai
  ECR_REPOSITORY_URI: 919551759796.dkr.ecr.ap-northeast-2.amazonaws.com/need-u/ai

jobs:
  deploy:
    name: Deploy AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.github_environment }}

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: deploy-${{ inputs.environment }}-ai
      cancel-in-progress: false

    steps:
      - name: Validate Inputs
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
          ALLOW_PROD_IMAGE: ${{ inputs.allow_prod_image }}
          AWS_CD_ROLE_ARN: ${{ vars.AWS_CD_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_ENVIRONMENT" =~ ^(dev|staging|prod)$ ]]; then
            echo "::error::지원하지 않는 배포 환경입니다: $DEPLOY_ENVIRONMENT"
            exit 1
          fi

          if [[ ! "$DEPLOYMENT_TYPE" =~ ^(image|config-only)$ ]]; then
            echo "::error::Invalid deployment type: $DEPLOYMENT_TYPE"
            exit 1
          fi

          if [[ "$DEPLOYMENT_TYPE" == "image" ]]; then
            if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Image deployment requires a 40-character SHA."
              exit 1
            fi
            if [[ "$DEPLOY_ENVIRONMENT" == "prod" && "$ALLOW_PROD_IMAGE" != "true" ]]; then
              echo "::error::Prod image deployments must use prod-deploy.yml."
              exit 1
            fi
          elif [[ -n "$IMAGE_SHA" ]]; then
            echo "::error::Do not specify image_sha for config-only."
            exit 1
          fi

          if [[ -z "$AWS_CD_ROLE_ARN" ]]; then
            echo "::error::GitHub Environment에 AWS_CD_ROLE_ARN 변수가 필요합니다."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Unexpected AWS account: $ACCOUNT_ID"
            exit 1
          fi

      - name: Resolve Deployment Resources
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          {
            echo "ECS_CLUSTER=needu-${DEPLOY_ENVIRONMENT}-cluster"
            echo "ECS_SERVICE=needu-${DEPLOY_ENVIRONMENT}-ai"
            echo "BASE_TASK_DEFINITION_PARAMETER=/needu/v2/${DEPLOY_ENVIRONMENT}/ecs/ai/base-task-definition-arn"
          } >> "$GITHUB_ENV"

      - name: Resolve Deployment Image
        shell: bash
        env:
          DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_TYPE" == "image" ]]; then
            IMAGE_TAG="v2-${IMAGE_SHA}"
            IMAGE="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
            echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          else
            CURRENT_TASK_ARN="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].taskDefinition' --output text)"
            if [[ -z "$CURRENT_TASK_ARN" || "$CURRENT_TASK_ARN" == "None" ]]; then
              echo "::error::Current task definition not found."
              exit 1
            fi
            IMAGE="$(aws ecs describe-task-definition \
              --task-definition "$CURRENT_TASK_ARN" --region "$AWS_REGION" \
              --query 'taskDefinition.containerDefinitions[?name==`ai`].image | [0]' \
              --output text)"
            if [[ -z "$IMAGE" || "$IMAGE" == "None" ]]; then
              echo "::error::Current AI image not found."
              exit 1
            fi
          fi
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Resolved image: $IMAGE"

      - name: Verify ECR Image
        if: inputs.deployment_type == 'image'
        shell: bash
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" > /dev/null
          echo "ECR image verified: $DEPLOY_IMAGE"

      - name: Verify Dev Image
        if: inputs.verify_dev_match && inputs.deployment_type == 'image'
        shell: bash
        run: |
          set -euo pipefail
          DEV_SERVICE="$(aws ecs describe-services \
            --cluster needu-dev-cluster \
            --services needu-dev-ai \
            --region "$AWS_REGION" \
            --query 'services[0]' --output json)"

          DEV_TASK_ARN="$(jq -r '.taskDefinition // empty' <<< "$DEV_SERVICE")"
          DEV_DESIRED="$(jq -r '.desiredCount // -1' <<< "$DEV_SERVICE")"
          DEV_RUNNING="$(jq -r '.runningCount // -1' <<< "$DEV_SERVICE")"
          DEV_ROLLOUT="$(jq -r '.deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' <<< "$DEV_SERVICE")"

          if [[ -z "$DEV_TASK_ARN" || "$DEV_DESIRED" -le 0 || "$DEV_RUNNING" -ne "$DEV_DESIRED" || "$DEV_ROLLOUT" != "COMPLETED" ]]; then
            echo "::error::Dev AI ECS 서비스가 안정적인 상태가 아닙니다."
            exit 1
          fi

          DEV_IMAGE="$(aws ecs describe-task-definition \
            --task-definition "$DEV_TASK_ARN" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[?name==`ai`].image | [0]' \
            --output text)"

          if [[ "$DEV_IMAGE" != "$DEPLOY_IMAGE" ]]; then
            echo "::error::Dev에서 검증 중인 이미지와 요청 이미지가 다릅니다."
            echo "Dev: $DEV_IMAGE"
            echo "Requested: $DEPLOY_IMAGE"
            exit 1
          fi
          echo "Dev ECS image verified: $DEV_IMAGE"

      - name: Read Terraform Baseline Task Definition
        shell: bash
        run: |
          set -euo pipefail
          BASE_TASK_DEFINITION_ARN="$(aws ssm get-parameter \
            --name "$BASE_TASK_DEFINITION_PARAMETER" \
            --region "$AWS_REGION" \
            --query 'Parameter.Value' \
            --output text)"

          if [[ -z "$BASE_TASK_DEFINITION_ARN" || "$BASE_TASK_DEFINITION_ARN" == "None" ]]; then
            echo "::error::Baseline Task Definition ARN not found."
            exit 1
          fi
          echo "BASE_TASK_DEFINITION_ARN=$BASE_TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      - name: Create Task Definition Revision
        id: task-definition
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$BASE_TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            --query 'taskDefinition' \
            --output json > baseline.json

          jq --arg IMAGE "$DEPLOY_IMAGE" '
            {
              family,
              taskRoleArn,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              placementConstraints,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform,
              ephemeralStorage,
              pidMode,
              ipcMode,
              proxyConfiguration,
              inferenceAccelerators
            }
            | with_entries(select(.value != null))
            | .containerDefinitions |= map(
                if .name == "ai" then .image = $IMAGE else . end
              )
          ' baseline.json > register-task-definition.json

          if ! jq -e --arg IMAGE "$DEPLOY_IMAGE" \
            '.containerDefinitions | any(.[]; .name == "ai" and .image == $IMAGE)' \
            register-task-definition.json > /dev/null; then
            echo "::error::AI container image was not updated."
            exit 1
          fi

          NEW_TASK_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://register-task-definition.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "task_definition_arn=$NEW_TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered: $NEW_TASK_ARN"

      - name: Update ECS Service
        shell: bash
        env:
          NEW_TASK_ARN: ${{ steps.task-definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_ARN" \
            --region "$AWS_REGION" > /dev/null
          echo "ECS service updated: $NEW_TASK_ARN"

      - name: Wait for ECS Service Stability
        shell: bash
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "AI ECS service is stable."

      - name: Verify Deployment
        shell: bash
        env:
          EXPECTED_TASK_ARN: ${{ steps.task-definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          SERVICE_STATE="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0]' \
            --output json)"

          CURRENT_TASK_ARN="$(jq -r '.taskDefinition // empty' <<< "$SERVICE_STATE")"
          DESIRED_COUNT="$(jq -r '.desiredCount // -1' <<< "$SERVICE_STATE")"
          RUNNING_COUNT="$(jq -r '.runningCount // -1' <<< "$SERVICE_STATE")"
          ROLLOUT="$(jq -r '.deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' <<< "$SERVICE_STATE")"

          if [[ "$CURRENT_TASK_ARN" != "$EXPECTED_TASK_ARN" ]]; then
            echo "::error::ECS Task Definition mismatch."
            exit 1
          fi

          if [[ "$RUNNING_COUNT" -ne "$DESIRED_COUNT" || "$ROLLOUT" != "COMPLETED" ]]; then
            echo "::error::ECS deployment is not stable: $RUNNING_COUNT/$DESIRED_COUNT ($ROLLOUT)"
            exit 1
          fi

          ACTUAL_IMAGE="$(aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_ARN" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[?name==`ai`].image | [0]' \
            --output text)"

          if [[ "$ACTUAL_IMAGE" != "$DEPLOY_IMAGE" ]]; then
            echo "::error::Deployed image mismatch."
            echo "Expected: $DEPLOY_IMAGE"
            echo "Actual: $ACTUAL_IMAGE"
            exit 1
          fi

          if [[ "$DESIRED_COUNT" -eq 0 ]]; then
            echo "AI Task Definition/image updated (service remains stopped 0/0)."
          else
            echo "AI deployment succeeded: $RUNNING_COUNT/$DESIRED_COUNT"
          fi

      - name: Deployment Summary
        if: success()
        shell: bash
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          NEW_TASK_ARN: ${{ steps.task-definition.outputs.task_definition_arn }}
        run: |
          {
            echo "## AI V2 Deployment"
            echo ""
            echo "- Environment: $DEPLOY_ENV"
            echo "- Type: ${{ inputs.deployment_type }}"
            echo "- Image: $DEPLOY_IMAGE"
            echo "- Terraform baseline: $BASE_TASK_DEFINITION_ARN"
            echo "- Deployed Task Definition: $NEW_TASK_ARN"
          } >> "$GITHUB_STEP_SUMMARY"
