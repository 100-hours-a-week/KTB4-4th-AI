name: AI CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: need-u/ai

jobs:
  # =========================================================
  # CI: Python Test
  # =========================================================
  check:
    name: Python Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Tests
        run: uv run --frozen pytest

  # =========================================================
  # V1: main Push -> SHA Image
  # =========================================================
  v1-ecr-push:
    name: Build & Push V1 Image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NEEDU_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build V1 Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA" \
            .

      - name: Push V1 Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA"

  # =========================================================
  # V2: dev Push -> v2-SHA Image
  # =========================================================
  v2-ecr-push:
    name: Build & Push V2 Image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build V2 Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:v2-$IMAGE_SHA" \
            .

      - name: Push V2 Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker push \
            "$REGISTRY/$ECR_REPOSITORY:v2-$IMAGE_SHA"

  # =========================================================
  # V2 Dev: ECR Push 성공 후 ECS 자동 배포
  # =========================================================
  deploy-dev:
    name: Deploy V2 Dev
    needs: v2-ecr-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      actions: read
      id-token: write

    uses: ./.github/workflows/deploy.yml

    with:
      environment: dev
      github_environment: dev
      image_sha: ${{ github.sha }}

    secrets: inherit
