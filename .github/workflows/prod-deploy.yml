name: AI V2 Production CD

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "V2 Docker image Git SHA (40 characters)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-prod:
    name: V2 Production Deploy

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/deploy.yml

    with:
      environment: prod
      github_environment: prod
      image_sha: ${{ inputs.image_sha }}
    secrets: inherit
