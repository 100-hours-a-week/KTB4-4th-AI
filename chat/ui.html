<!doctype html>
<meta charset="utf-8">
<title>니쥬 대화 테스트</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#fff; --line:#e3e3e6; --ink:#1c1c1f; --dim:#75757d;
    --me:#2f6df6; --ai:#efeff2; --ok:#1b8a4b; --warn:#b8541a; --bad:#c0342b;
    --tag:#eef1f8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#151517; --panel:#1d1d20; --line:#2e2e33; --ink:#e9e9ec; --dim:#8d8d96;
           --ai:#28282d; --tag:#252a36; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
  .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
        gap:14px;padding:14px;height:100vh}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;
       display:flex;flex-direction:column;min-height:0;overflow:hidden}
  header{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:10px;flex-wrap:wrap}
  header b{font-size:13px}
  .meta{color:var(--dim);font-size:11.5px}
  button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);
         background:var(--panel);color:var(--ink);border-radius:7px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button:disabled{opacity:.4;cursor:default}
  .spacer{flex:1}

  /* ---- chat ---- */
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:78%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .ai{background:var(--ai);align-self:flex-start;border-bottom-left-radius:4px}
  .me{background:var(--me);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .tick{align-self:flex-start;color:var(--dim);font-size:11px;margin-top:-7px}
  .sys{align-self:center;color:var(--dim);font-size:12px;text-align:center;
       border:1px dashed var(--line);border-radius:8px;padding:6px 12px}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  #inp{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);
       border-radius:9px;background:var(--bg);color:var(--ink)}
  #inp:focus{outline:2px solid var(--me);outline-offset:-1px}

  /* ---- panel ---- */
  #panel{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
  .box{border:1px solid var(--line);border-radius:9px;padding:11px 12px}
  .box h3{margin:0 0 8px;font-size:11px;letter-spacing:.06em;color:var(--dim);
          text-transform:uppercase;font-weight:600}
  .goal{font-size:15px;font-weight:600}
  .why{color:var(--dim);font-size:12.5px;margin-top:3px}
  .directive{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:7px;
             font-size:12.5px;color:var(--dim)}
  .counts{display:flex;flex-wrap:wrap;gap:6px}
  .c{background:var(--tag);border-radius:6px;padding:3px 9px;font-size:12px}
  .c b{font-variant-numeric:tabular-nums}
  .c.on{background:var(--ok);color:#fff}
  .field{margin-bottom:9px}
  .field:last-child{margin-bottom:0}
  .fname{font-size:11px;color:var(--dim);margin-bottom:3px}
  .item{display:flex;gap:7px;align-items:baseline;padding:2px 0;flex-wrap:wrap}
  .item .v{font-size:13px}
  .item .s{font-size:11px;color:var(--dim)}
  .pill{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--tag);color:var(--dim)}
  .pill.q{background:#1b8a4b;color:#fff}
  .pill.f{background:#c0342b;color:#fff}
  .pill.w{background:#7b6bd6;color:#fff}
  .pill.ai_only{background:#b8541a;color:#fff}
  .new{animation:flash 1.1s ease-out}
  @keyframes flash{from{background:#1b8a4b33}to{background:transparent}}
  .empty{color:var(--dim);font-size:12.5px}
  .goals{display:flex;flex-wrap:wrap;gap:4px;font-size:11px}
  .goals span{background:var(--tag);border-radius:5px;padding:2px 6px;color:var(--dim)}
  .goals span:last-child{background:var(--me);color:#fff}
  .q{border-left:3px solid var(--ok);padding:6px 0 6px 10px;margin-bottom:9px}
  .q.derived{border-left-color:#7b6bd6}
  .q .t{font-size:13px}
  .q .src{font-size:11px;color:var(--dim);margin-top:2px}
  pre{margin:0;font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-all}
  .err{color:var(--bad);font-size:12.5px}
</style>

<div class="wrap">
  <div class="col">
    <header>
      <b>대화</b>
      <span class="meta" id="models"></span>
      <span class="spacer"></span>
      <button id="finish">결과 보기</button>
      <button id="reset">새로 시작</button>
    </header>
    <div id="log"></div>
    <form id="f">
      <input id="inp" placeholder="답변을 입력하세요" autocomplete="off">
      <button id="send">보내기</button>
    </form>
  </div>

  <div class="col">
    <header><b>서버가 보는 것</b><span class="meta">사용자에게는 안 보임</span></header>
    <div id="panel">
      <div class="box">
        <h3>이번 턴 목표</h3>
        <div class="goal" id="gname">—</div>
        <div class="why" id="gwhy"></div>
        <div class="directive" id="gdir" hidden></div>
      </div>
      <div class="box">
        <h3>종료 조건</h3>
        <div class="counts" id="counts"><span class="empty">아직 없음</span></div>
      </div>
      <div class="box">
        <h3>추출된 스키마</h3>
        <div id="buckets"><span class="empty">아직 없음</span></div>
      </div>
      <div class="box">
        <h3>목표 이력</h3>
        <div class="goals" id="goals"><span class="empty">—</span></div>
      </div>
      <div class="box" id="resultbox" hidden>
        <h3>검색 단계로 넘길 것</h3>
        <div id="result"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const log = $("#log"), panel = $("#panel");
let closed = false, busy = false;

const ROLE = { query:"q", filter:"f", weight:"w" };
const FIELD_KO = {
  interests:"관심사", hobbies:"취미", preferences:"선호", dislikes:"싫어함",
  lifestyle:"생활맥락", wants:"갖고싶음", unaffordable:"못산것",
  owned:"보유", consumables:"소모품", constraints:"제약",
};

function bubble(cls, text=""){
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function note(text, cls="tick"){
  const d = document.createElement("div");
  d.className = cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

async function sse(url, body, on){
  const r = await fetch(url, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body||{}),
  });
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while(true){
    const {value, done} = await rd.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf("\n\n")) >= 0){
      const block = buf.slice(0, i); buf = buf.slice(i+2);
      let ev = "message", data = "";
      for(const line of block.split("\n")){
        if(line.startsWith("event:")) ev = line.slice(6).trim();
        else if(line.startsWith("data:")) data += line.slice(5).trim();
      }
      if(data) on(ev, JSON.parse(data));
    }
  }
}

function renderGoal(g){
  $("#gname").textContent = g.name;
  $("#gwhy").textContent = g.reason;
  const d = $("#gdir"); d.textContent = "지시: " + g.directive; d.hidden = false;
}

function renderState(st){
  const c = st.counts;
  $("#counts").innerHTML = [
    ["턴", c["턴"], false],
    ["검색용", `${c["검색용"]}/3`, c["검색용"]>=3],
    ["확신0.6+", `${c["확신0.6+"]}/2`, c["확신0.6+"]>=2],
    ["필터", `${c["필터"]}/1`, c["필터"]>=1],
    ["want", c["want"], c["want"]>=1],
    ["전체", `${c["전체"]}/12`, false],
  ].map(([k,v,on]) => `<span class="c ${on?"on":""}">${k} <b>${v}</b></span>`).join("");

  const b = st.buckets, keys = Object.keys(b);
  $("#buckets").innerHTML = keys.length ? keys.map(f => `
    <div class="field">
      <div class="fname">${FIELD_KO[f]||f}</div>
      ${b[f].map(i => `
        <div class="item">
          <span class="pill ${ROLE[i.role]}">${i.role}</span>
          <span class="v">${esc(i.value)}</span>
          <span class="s">${i.confidence}</span>
          ${i.intent ? `<span class="pill">${i.intent}</span>` : ""}
          ${i.defer ? `<span class="pill">defer:${i.defer}</span>` : ""}
          ${i.visibility==="ai_only" ? `<span class="pill ai_only">비공개</span>` : ""}
        </div>`).join("")}
    </div>`).join("") : `<span class="empty">아직 없음</span>`;

  $("#goals").innerHTML = st.goals.map(g => `<span>${g}</span>`).join("") || "—";
  if(st.axes.length) $("#goals").innerHTML += `<span style="background:var(--tag);color:var(--dim)">axes: ${st.axes.join(" · ")}</span>`;
}

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

async function runTurn(url, body){
  busy = true;
  $("#send").disabled = true; $("#send").textContent = "…";
  let node = null;
  try{
    await sse(url, body, (ev, d) => {
      if(ev === "goal"){ renderGoal(d); node = bubble("ai"); }
      else if(ev === "token"){ node.textContent += d.t; log.scrollTop = log.scrollHeight; }
      else if(ev === "replace"){ node.textContent = d.text; }
      else if(ev === "extract"){
        const bits = d.added.map(a => `+${a.value}(${a.field})`).concat(d.dropped.map(v=>`-${v}`));
        note(bits.length ? `추출 ${d.ms}ms · ${bits.join(" · ")}` : `추출 ${d.ms}ms · 새로 알아낸 것 없음`);
      }
      else if(ev === "extract_error"){ note("추출 실패: " + d.message, "sys"); }
      else if(ev === "done"){
        note(`첫글자 ${d.ttft}s · 완료 ${d.total}s`);
        renderState(d.state);
        if(d.closed){
          closed = true;
          note("종료 조건을 채워서 대화를 마쳤습니다. 결과를 만드는 중…", "sys");
          setTimeout(finish, 300);
        }
      }
      else if(ev === "error"){ note("오류: " + d.message, "sys"); }
    });
  }catch(e){ note("연결 실패: " + e.message, "sys"); }
  finally{
    busy = false;
    $("#send").disabled = closed;
    $("#send").textContent = "보내기";
    $("#inp").disabled = closed;
    $("#inp").focus();
  }
}

async function finish(){
  $("#resultbox").hidden = false;
  $("#result").innerHTML = `<span class="empty">만드는 중…</span>`;
  try{
    await sse("/api/finish", {}, (ev, d) => {
      if(ev === "result") renderResult(d);
      else if(ev === "error") $("#result").innerHTML = `<span class="err">${esc(d.message)}</span>`;
    });
  }catch(e){ $("#result").innerHTML = `<span class="err">${e.message}</span>`; }
  $("#resultbox").scrollIntoView({behavior:"smooth"});
}

function renderResult(r){
  const q = r.queries.map(q => `
    <div class="q ${q.kind==='derived'?'derived':''}">
      <div class="t">${esc(q.text)}</div>
      <div class="src">← ${esc(q.source)} · ${q.field} · <b>${q.mode}</b> · ${q.confidence.toFixed(2)}${q.giftWeight !== 1 ? ` · 선물가중 ${q.giftWeight}` : ""}</div>
    </div>`).join("");
  const f = r.filters;
  $("#result").innerHTML = `
    <div class="fname">요약문 (친구도 봄)</div>
    <div style="margin:4px 0 14px">${esc(r.summary) || '<span class="empty">재료 없음</span>'}</div>
    <div class="fname">임베딩에 던질 쿼리 (${r.queries.length}) · 배치 ${r.embeddingBatch.length}건 1회 호출</div>
    <div style="margin:6px 0 14px">${q || '<span class="err">없음 — 검색을 시작할 수 없다</span>'}</div>
    <div class="fname">하드필터 (SQL WHERE)</div>
    <div style="margin:4px 0 14px;font-size:12.5px">
      ${["dislikes","constraints","owned"].map(k =>
        `${k}: ${f[k].length ? esc(f[k].join(" · ")) : '<span class="empty">없음</span>'}`).join("<br>")}
    </div>
    <div class="fname">순위 조정용</div>
    <div style="font-size:12.5px">${r.weights.length ? esc(r.weights.join(" · ")) : '<span class="empty">없음</span>'}</div>
    <details style="margin-top:14px">
      <summary class="fname" style="cursor:pointer">TasteProfile (계약 형태)</summary>
      <pre style="font-size:11.5px;overflow:auto;max-height:340px">${esc(JSON.stringify(r.profile, null, 2))}</pre>
    </details>
    <div class="src" style="margin-top:12px">${r.ms}ms · 초록=취향에서 직접 · 보라=생활맥락에서 파생(self 전용)</div>
    <div class="src">임베딩 호출과 벡터 검색은 이 하네스 밖이다. 여기까지가 그 입력이다.</div>`;
}

$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#inp").value.trim();
  if(!v || busy || closed) return;
  $("#inp").value = "";
  bubble("me", v);
  runTurn("/api/turn", {message: v});
});

$("#finish").addEventListener("click", () => { if(!busy) finish(); });

$("#reset").addEventListener("click", start);

async function start(){
  log.innerHTML = ""; closed = false;
  $("#resultbox").hidden = true;
  $("#gname").textContent = "—"; $("#gwhy").textContent = ""; $("#gdir").hidden = true;
  $("#counts").innerHTML = `<span class="empty">아직 없음</span>`;
  $("#buckets").innerHTML = `<span class="empty">아직 없음</span>`;
  $("#goals").innerHTML = "—";
  const r = await (await fetch("/api/reset", {method:"POST"})).json();
  $("#models").textContent = `${r.models.response} · ${r.models.base}`;
  await runTurn("/api/open", {});
}
start();
</script>
