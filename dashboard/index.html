<!doctype html>
<html lang="ko">

    <title>Need U · AI Lab</title>
    <link rel="icon" href="/assets/needu-character.png" type="image/png" />

      <div class="workspace-label">WORKSPACE <span>V2</span></div>
      <nav aria-label="관리 메뉴">
        <a href="#overview" data-page="overview"
          ><span class="nav-icon"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z" /></svg></span

        >
        <a href="#chat" data-page="chat"
          ><span class="nav-icon"

              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"

            >
              <path d="M4 4h16v12H9l-5 4z" /></svg></span

        <div class="top-right">

      <footer>Need U AI Lab <span>같은 입력. 기록된 조건. 검증 가능한 선택.</span></footer>
